<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhyBlog — Be back soon</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/k6wtC2Jq/file-00000000e51c821096528334f88d8554-copy-300x300.png" />
<link rel="apple-touch-icon" href="https://i.ibb.co/k6wtC2Jq/file-00000000e51c821096528334f88d8554-copy-300x300.png" />
<style>
  :root {
    --ink: #e7ecef;
    --ink-soft: #a9b4bd;
    --ink-faint: #71808c;
    --paper: #16202b;
    --card: #1c2733;
    --line: #2c3944;
    --accent: #2fa393;
    --accent-soft: #1e3833;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }

  .shell {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--card);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }

  .wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 28px 40px;
  }

  .wordmark {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    margin-bottom: 36px;
  }
  .wordmark .why {
    background: linear-gradient(90deg, #22e0d0, #2f7dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .wordmark .blog { color: #ffffff; }

  .badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .badge svg { display: block; }

  h1 {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    color: var(--ink);
  }

  p.sub {
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 340px;
    margin: 0 0 30px;
  }

  .action {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #0d1116;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 24px;
    border-radius: 12px;
  }
  .action:active { opacity: 0.85; }

  .foot {
    margin-top: 24px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="wrap">
      <div class="wordmark"><span class="why">Why</span><span class="blog">Blog</span></div>

      <div class="badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 8v4l3 3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="9"/>
        </svg>
      </div>

      <h1>We'll be back soon</h1>
      <p class="sub">WhyBlog is getting an update. Follow the channel and we'll post the moment we're back online.</p>

      <a class="action" href="https://t.me/WhyBlogBrodcast" target="_blank" rel="noopener">
        Follow WhyBlog Channel
      </a>

      <div class="foot">Thanks for your patience</div>
    </div>
  </div>
</body>
</html>
